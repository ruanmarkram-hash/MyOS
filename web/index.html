<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/icon-192.png" />
    <meta name="theme-color" content="#0f1015" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>Mission Control · MyOS</title>
    <script>
      // Apply theme before render to avoid FOUC.
      try {
        const saved = localStorage.getItem('myos.theme');
        if (saved === 'midnight' || saved === 'crimson' || saved === 'graphite') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
